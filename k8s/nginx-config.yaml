apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 80;

        location /api/sa {
          proxy_pass http://service-a;
        }

        location /api/sb {
          proxy_pass http://service-b;
        }

        location /healthz {
          return 200 "ok\n";
        }
      }
    }